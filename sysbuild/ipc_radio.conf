# sysbuild/ipc_radio.conf

# Enable Extended Advertising
CONFIG_BT_EXT_ADV=y

# Enable Isochronous Channels (This configures the SoftDevice Controller)
CONFIG_BT_ISO_PERIPHERAL=y

# Allocate memory buffers for standard connection (ACL) + ISO streams (CIS)
CONFIG_BT_MAX_CONN=4
CONFIG_BT_ISO_MAX_CHAN=4

# Use the module's actual physical 32.768 kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
