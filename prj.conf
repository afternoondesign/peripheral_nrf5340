# prj.conf

# ---------------------------------
# 0. Basic GPIO & Button Config
# ---------------------------------
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_LED=y

# ---------------------------------
# 1. Core Bluetooth Subsystem
# ---------------------------------
CONFIG_BT=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_DEVICE_APPEARANCE=2369
#0x2369 is the assigned code for an earbud
CONFIG_BT_DEVICE_NAME="nRF5340_LE_Audio"
CONFIG_BT_GATT_DYNAMIC_DB=y
# Enables the GATT Client, allowing the stack to handle and confirm Indications (0x1D)
CONFIG_BT_GATT_CLIENT=y
# Security - allegedly allows pairing over BLE
CONFIG_BT_SMP=y
# Enhanced ATT and Dependencies
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_ECRED=y
CONFIG_BT_EATT=y
CONFIG_BT_GATT_READ_MULTIPLE=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y commented out because its apparently set in .config by default
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# Set preferred values based on BT_BAP_CONN_PARAM_RELAXED
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=50
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=70
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ---------------------------------
# 2. Security (CRITICAL for LE Audio)
# ---------------------------------
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y

# Persist Bluetooth bonds and identity keys in the board's storage flash area.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# ---------------------------------
# 3. LE Audio & BAP Settings
# ---------------------------------
CONFIG_BT_AUDIO=y
CONFIG_BT_PERIPHERAL=y
CONFIG_UTF8=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_ISO_TX_BUF_COUNT=3
CONFIG_BT_ISO_RX_BUF_COUNT=5
# # Support an ISO channel per ASE
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_ISO_RX_MTU=251
CONFIG_BT_ISO_TX_MTU=251
CONFIG_I2S=y
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=1 
# temporarily set ASE_SNK to 1, reset to 2 later
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=1
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_PAC_SNK=y
CONFIG_BT_PAC_SNK_NOTIFIABLE=y
CONFIG_BT_PAC_SRC=y
CONFIG_BT_PAC_SRC_NOTIFIABLE=y
# Volume Control
CONFIG_BT_VCP_VOL_REND=y
# CONFIG_BT_VCP_VOL_REND_VOCS_INSTANCE_COUNT=0
# CONFIG_BT_VCP_VOL_REND_AICS_INSTANCE_COUNT=0
# # Stereo/headset settings
# CONFIG_BT_CSIP_SET_MEMBER=y
# CONFIG_BT_AUDIO_CONCURRENT_RX_STREAMS_MAX=2
# CONFIG_AUDIO_DECODE_CHANNELS_MAX=2
# CONFIG_AUDIO_SOURCE_I2S=y

# ---------------------------------
# 4. CAP & TMAP (Telephony & Media)
# ---------------------------------
# CONFIG_BT_CAP_ACCEPTOR=y
# CONFIG_BT_TMAP=y

# ---------------------------------
# 5. Codec (LC3) & Hardware
# ---------------------------------
CONFIG_FPU=y
CONFIG_LIBLC3=y
CONFIG_SW_CODEC_LC3_T2_SOFTWARE=y
CONFIG_LC3_ENC_CHAN_MAX=1
CONFIG_LC3_DEC_CHAN_MAX=2
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=2048
# Increase buffer for incoming stream metadata from Android/iOS
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=64

# ---------------------------------
# 6. Logging
# ---------------------------------
CONFIG_LOG=y
CONFIG_INFO_REPORTING_INTERVAL=5000
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y

# ---------------------------------
# 7. Memory & Buffers (For Audio Metadata)
# ---------------------------------
CONFIG_BT_ATT_PREPARE_COUNT=2

# Always enable bidirectional stream support on the server.
# The client may not support it, but the server should be able to handle it if the client does.
# CONFIG_STREAM_BIDIRECTIONAL=y

# ---------------------------------
# 8. Thread Stack Sizes (Required for LE Audio/LC3)
# ---------------------------------
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096